<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Test Cases vs Reported Defects</title>
  <desc id="desc">Pie chart comparing 113 test cases and 33 reported defects. These are separate counts, and defects may be associated with test cases.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">Test Cases vs Reported Defects</text>
  <!-- Pie chart uses the two requested counts as comparison values: 113 and 33. -->
  <path d="M 270 220 L 270 90 A 130 130 0 1 1 194.6 325.9 Z" fill="#4472C4"/>
  <path d="M 270 220 L 194.6 325.9 A 130 130 0 0 1 270 90 Z" fill="#ED7D31"/>
  <circle cx="270" cy="220" r="130" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="465" y="155" width="18" height="18" rx="2" fill="#4472C4"/>
  <text x="495" y="169" font-family="Arial, sans-serif" font-size="17" fill="#222222">Test cases: 113</text>
  <rect x="465" y="198" width="18" height="18" rx="2" fill="#ED7D31"/>
  <text x="495" y="212" font-family="Arial, sans-serif" font-size="17" fill="#222222">Defects: 33</text>
  <text x="360" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#555555">Count comparison only; defects may be linked to test cases.</text>
</svg>
